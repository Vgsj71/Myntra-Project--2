<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header>
            <div class="logo_container">
                <a href="#"><img class="myntra_home" src="myntra_logo.webp" alt="Myntra Home"></a>
            </div>
            <nav class="nav_bar">
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="#">Kids</a>
                <a href="#">Home & Living</a>
                <a href="#">Beauty</a>
                <a href="#">Studio <sup>New</sup></a>
            </nav>
            <div class="search_bar">
                <span class="material-symbols-outlined search_icon">search</span>
                <input class="search_input" placeholder="Search for products, brands and more">
            </div>
            <div class="action_bar">
                <a class="action_container" href="#">
                    <span class="material-symbols-outlined action_icon">person</span>
                    <span class="action_name">Profile</span>
                </a>
    
                <div class="action_container">
                    <span class="material-symbols-outlined action_icon">favorite</span>
                    <span class="action_name">Wishlist</span>
                </div>
                
                <a class="action_container" href="../Bagpage code/bag.html">
                    <span class="material-symbols-outlined action_icon">shopping_bag</span>
                    <span class="action_name">Bag</span>
                    <spna class="bag_item_count">0</spna>
                </a>
            </div>
        </header>
    <main>
        <div class="profile_container">
            <div class="img_container">
                <img class="image" width="200px" src="pf.avif">
            </div>
            <div class="profile_info">
                <div class="name">
                    <h1>Profile Update</h1>
                </div>
                <div class="name">
                    <label class="name_in">First Name</label>
                    <input class="name_input" type="text" placeholder="first name">
                </div>
                <div class="name"> 
                    <label class="name_in">Last Name</label>
                    <input class="name_input" type="text" placeholder="last name">
                </div>
                <div class="name">
                    <label class="name_in">Email Id</label>
                    <input class="name_input email_input" type="text" placeholder="email id">
                </div>
                <div class="name">
                    <label class="name_in">Mobile Number</label>
                    <input class="name_input number_input" type="number" placeholder="mobile number">
                </div>
                <div class="name">
                    <label class="name_in">State</label>
                    <input class="name_input state_input" type="text" placeholder="state">
                </div>
                <div class="name">
                    <label class="name_in">Post Code</label>
                    <input class="name_input post_input" type="number" placeholder="postcode">
                </div>
                <div class="name">
                    <label class="name_in address">Address Line 1</label>
                    <input class="Address_input" type="text" placeholder="Address Line 1">
                </div>
                <div class="name">
                    <label class="name_in address">Address Line 2</label>
                    <input class="Address_input" type="text" placeholder="Address Line 2">
                </div>
                <button class="btn">Save</button>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
